<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 10px;
}
.header { grid-column: span 12; }
.banner { grid-column: span 12; }
.section { grid-column: span 4; }
.card { grid-column: span 3; }
.footer { grid-column: span 12; }
.box {
  background: #F5F7FA;
  padding: 20px;
}
</style>
</head>
<body>
<div class="container">
<div class="header box">LOGO + 導覽列</div>
<div class="banner box">Banner</div>
<div class="section box">熱門評測</div>
<div class="section box">最新文章</div>
<div class="section box">推薦產品</div>
<div class="card box">文章1</div>
<div class="card box">文章2</div>
<div class="card box">文章3</div>
<div class="card box">文章4</div>
<div class="footer box">Footer</div>
</div>
</body>
</html>
