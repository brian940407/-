<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學生自我介紹</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe, #fef9c3);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 750px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: #3b82f6;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1rem;
    }

    .content {
      padding: 30px;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h2 {
      font-size: 1.3rem;
      color: #2563eb;
      margin-bottom: 10px;
    }

    .section p, .section li {
      color: #444;
      line-height: 1.7;
    }

    ul {
      padding-left: 20px;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      color: #777;
      background: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>你好，我是李家仁</h1>
      <p>目前就讀南亞的學生</p>
    </div>

    <div class="content">
      <div class="section">
        <h2>基本資料</h2>
        <p>學校：南亞技術學院</p>
        <p>科系：資訊工程科系</p>
        <p>年級：3年級</p>
      </div>

      <div class="section">
        <h2>關於我</h2>
        <p>
          我是一名學生，對學習新知識充滿熱情，特別喜歡資訊科技與網頁設計。
          平時會利用課餘時間自學程式，希望未來能夠在相關領域發展。
        </p>
      </div>

      <div class="section">
        <h2>興趣</h2>
        <ul>
          <li>寫程式</li>
          <li>打遊戲</li>
          <li>看影片／動漫</li>
          <li>學習新技術</li>
        </ul>
      </div>

      <div class="section">
        <h2>專長技能</h2>
        <ul>
          <li>簡單 JavaScript</li>
          <li>文書處理（Word / PowerPoint）</li>
        </ul>
      </div>

      <div class="section">
        <h2>未來目標</h2>
        <p>
          希望能持續精進程式能力，未來成為一名優秀的工程師，
          並開發出實用的網站或應用程式。
        </p>
      </div>
    </div>

    <div class="footer">
      © 2026 學生自我介紹
    </div>
  </div>
</body>
</html>
